<!-- 
  Composant racine - Template
  Gestion de Stock Frontend
-->

<!-- Loading Overlay Global -->
@if (loadingService.isLoading()) {
  <div 
    class="fixed inset-0 z-[100] flex items-center justify-center bg-white/80 dark:bg-gray-900/80 backdrop-blur-sm"
    [@fadeInOut]
  >
    <div class="flex flex-col items-center gap-4">
      <!-- Logo animé -->
      <div class="relative">
        <div class="w-16 h-16 border-4 border-primary-200 dark:border-primary-800 rounded-full"></div>
        <div class="absolute top-0 left-0 w-16 h-16 border-4 border-primary-600 border-t-transparent rounded-full animate-spin"></div>
      </div>
      
      <!-- Texte de chargement -->
      <div class="text-center">
        <p class="text-lg font-medium text-gray-900 dark:text-gray-100">
          Chargement<span class="loading-dots"></span>
        </p>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
          Veuillez patienter
        </p>
      </div>
    </div>
  </div>
}

<!-- Router Outlet Principal -->
<router-outlet />

<!-- Toast Container (Notifications) -->
<app-toast />
